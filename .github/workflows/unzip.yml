name: Unzip to root

on:
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          unzip -o README.zip -d .
          rm README.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unzip README.zip" || echo "No changes"
          git push
